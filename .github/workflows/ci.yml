name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package app
        run: scripts/package_app.sh build

      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Barista.app build/Barista-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barista-macos
          path: build/Barista-macos.zip
